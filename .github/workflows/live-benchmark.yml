name: Live Production Benchmark

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Worker URL to benchmark
        required: false
        default: https://openmemory-api.abbierman101.workers.dev
      graph_size:
        description: Synthetic graph size. The test clamps this between 40 and 160.
        required: false
        default: "80"

jobs:
  live-benchmark:
    name: Hosted graph benchmark
    runs-on: ubuntu-latest
    env:
      OPENMEMORY_LIVE_BASE_URL: ${{ github.event.inputs.base_url || 'https://openmemory-api.abbierman101.workers.dev' }}
      OPENMEMORY_LIVE_GRAPH_SIZE: ${{ github.event.inputs.graph_size || '80' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore recent benchmark history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HISTORY_DIR="$RUNNER_TEMP/openmemory-benchmark-history"
          rm -rf "$HISTORY_DIR"
          mkdir -p "$HISTORY_DIR" .tmp/benchmark-reports
          for run_id in $(gh run list --workflow "Live Production Benchmark" --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run download "$run_id" --name live-production-benchmark --dir "$HISTORY_DIR/$run_id" || true
          done
          find "$HISTORY_DIR" -path '*/history/*' -prune -o -name '*.jsonl' -print0 | xargs -0 cat > .tmp/benchmark-reports/live-production-history.jsonl || true

      - name: Run hosted graph benchmark
        run: bun run test:benchmark:live

      - name: Write benchmark trend summary
        if: always()
        run: |
          : > .tmp/benchmark-reports/live-production-trend.jsonl
          [ -s .tmp/benchmark-reports/live-production-history.jsonl ] && cat .tmp/benchmark-reports/live-production-history.jsonl >> .tmp/benchmark-reports/live-production-trend.jsonl
          [ -s .tmp/benchmark-reports/live-production.jsonl ] && cat .tmp/benchmark-reports/live-production.jsonl >> .tmp/benchmark-reports/live-production-trend.jsonl
          bun run benchmark:trend -- .tmp/benchmark-reports/live-production-trend.jsonl --out .tmp/benchmark-reports/live-production-summary.md

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-benchmark
          path: |
            .tmp/benchmark-reports/live-production.jsonl
            .tmp/benchmark-reports/live-production-history.jsonl
            .tmp/benchmark-reports/live-production-trend.jsonl
            .tmp/benchmark-reports/live-production-summary.md
          if-no-files-found: ignore
