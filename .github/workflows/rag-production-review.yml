name: RAG Production Review

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail until graph/RAG production review evidence is recorded
        required: false
        default: "false"
        type: boolean

jobs:
  review-gate:
    name: Validate RAG production review evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate status artifact
        if: ${{ !inputs.strict }}
        run: bun run rag:production-review:status

      - name: Run strict launch gate
        if: ${{ inputs.strict }}
        run: bun run rag:production-review:check
