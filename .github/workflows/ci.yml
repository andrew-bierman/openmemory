name: CI

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      min_requests:
        description: Minimum request volume before rate thresholds can breach
        required: false
        default: "20"
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan
        run: bun run security:secrets

      - name: Check
        run: bun run verify

      - name: Build
        run: bun run build

  lint:
    name: Lint (canary Bun)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Lint on the pinned canary
        # Canaries ship to npm, not GitHub releases, so the pin resolves
        # through bunx rather than the bun.sh installer.
        run: bunx bun@$(cat .bun-canary-version) lint

  local-wrangler-integration:
    name: Local Wrangler integration
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local Wrangler integration tests
        run: bun run test:integration:local

      - name: Vitest sweep (integration, live, budget)
        run: bun run --cwd apps/api test:vitest

  d1-migrations:
    name: D1 migrations (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Back up production D1
        run: bun run --cwd apps/api wrangler d1 export openmemory-auth --remote --output ../d1-backup-${{ github.sha }}.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v5
        with:
          name: d1-backup-${{ github.sha }}
          path: d1-backup-${{ github.sha }}.sql
          retention-days: 30

      - name: Verify no diverged migration state
        run: |
          pending="$(bun run --cwd apps/api wrangler d1 migrations list openmemory-auth --remote)"
          echo "$pending"
          if echo "$pending" | grep -q "0006_team_accounts" && ! echo "$pending" | grep -q "0004_oauth_consent_lookup"; then
            echo "::error::0006_team_accounts is recorded applied while 0004_oauth_consent_lookup is still pending — an earlier 0006 revision diverged. Do not apply; follow docs/validation-2026-10-17.md."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        run: bun run --cwd apps/api wrangler d1 migrations apply openmemory-auth --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  mcp-sdk-smoke:
    name: MCP SDK smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run MCP SDK streamable HTTP smoke
        run: bun run test:mcp:sdk

  local-web-e2e:
    name: Local web E2E
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run local dashboard browser tests
        run: bun run test:e2e:local

  analytics-thresholds:
    name: Analytics Engine threshold check
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENMEMORY_ALERT_MIN_REQUESTS: ${{ github.event.inputs.min_requests || '20' }}
      OPENMEMORY_ANALYTICS_DATASET: openmemory_events
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Self-test threshold evaluator
        run: bun run observability:alerts:self-test

      - name: Check Analytics Engine thresholds
        if: github.event_name != 'pull_request' && env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_CLOUDFLARE_ACCOUNT_ID == 'true'
        run: bun run observability:alerts

      - name: Skip remote threshold check
        if: github.event_name == 'pull_request' || env.HAS_CLOUDFLARE_API_TOKEN != 'true' || env.HAS_CLOUDFLARE_ACCOUNT_ID != 'true'
        run: |
          echo "Skipping remote Analytics Engine threshold check because this event cannot or should not use Cloudflare analytics secrets."
