name: MCP Inspector Dogfood

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Worker URL to inspect
        required: false
        default: https://openmemory-api.abbierman101.workers.dev

jobs:
  inspector-dogfood:
    name: Run MCP Inspector CLI against production
    runs-on: ubuntu-latest
    env:
      OPENMEMORY_LIVE_BASE_URL: ${{ github.event.inputs.base_url || 'https://openmemory-api.abbierman101.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run MCP Inspector dogfood
        run: bun run mcp:inspector:live
