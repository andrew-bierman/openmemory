name: Social OAuth Dogfood

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail until GitHub and Google hosted sign-in evidence is recorded
        required: false
        default: "false"
        type: boolean

jobs:
  dogfood-gate:
    name: Validate social OAuth dogfood evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate status artifact
        if: ${{ !inputs.strict }}
        run: bun run social-oauth:status

      - name: Run strict launch gate
        if: ${{ inputs.strict }}
        run: bun run social-oauth:check
