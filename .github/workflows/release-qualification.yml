name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      scale_graph_size:
        description: Optional graph size for the high-volume local scale gate. Use 0 to skip.
        required: false
        default: "1000"

jobs:
  qualify:
    name: Full local release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run release validation
        run: bun run release:validate

      - name: Run high-volume local scale gate
        if: ${{ github.event.inputs.scale_graph_size != '0' }}
        run: bun run test:scale:local
        env:
          OPENMEMORY_SCALE_GRAPH_SIZE: ${{ github.event.inputs.scale_graph_size }}
